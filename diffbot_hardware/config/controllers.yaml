# controllers.yaml — ROS2 Humble compatible
#
# ALL parameters live under controller_manager/ros__parameters so the
# controller manager node can see them in its own namespace. This is the
# only layout that works reliably in Humble when robot_description is
# passed via topic (not parameter).

controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names:  ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.160
    wheel_radius:     0.033

    wheel_separation_multiplier:   1.0
    left_wheel_radius_multiplier:  1.0
    right_wheel_radius_multiplier: 1.0

    open_loop:        false
    enable_odom_tf:   true
    odom_frame_id:    odom
    base_frame_id:    base_link

    cmd_vel_timeout:  0.5
    publish_rate:     50.0

    linear.x.has_velocity_limits:     true
    linear.x.max_velocity:            0.5
    linear.x.min_velocity:           -0.5
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration:        1.0
    linear.x.min_acceleration:       -1.0
    linear.x.has_jerk_limits:         false

    angular.z.has_velocity_limits:     true
    angular.z.max_velocity:            2.0
    angular.z.min_velocity:           -2.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration:        2.0
    angular.z.min_acceleration:       -2.0
    angular.z.has_jerk_limits:         false

    pose_covariance_diagonal:  [0.001, 0.001, 1.0e6, 1.0e6, 1.0e6, 0.01]
    twist_covariance_diagonal: [0.001, 1.0e6, 1.0e6, 1.0e6, 1.0e6, 0.01]

joint_state_broadcaster:
  ros__parameters:
    joints:
      - left_wheel_joint
      - right_wheel_joint